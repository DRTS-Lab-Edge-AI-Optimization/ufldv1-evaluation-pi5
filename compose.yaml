services:
  ufld-eval:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: ufld-tusimple-eval
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-change-me}
      OMP_NUM_THREADS: ${ORT_THREADS:-4}
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./notebooks:/app/notebooks:ro
      - ./models:/models:ro
      - ./data:/data:ro
      - ./results:/results
    mem_limit: 2g
    cpus: 4
    restart: "no"
